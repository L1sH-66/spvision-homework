name: Ubuntu 22.04 ROS Humble
on: [push, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential cmake python3-colcon-common-extensions python3-yaml python3-numpy python3-pil python3-pygame python3-opencv qtbase5-dev libopencv-dev libyaml-cpp-dev ros-humble-pluginlib ros-humble-tf2-ros ros-humble-tf2-geometry-msgs ros-humble-nav-msgs ros-humble-std-srvs ros-humble-rviz2 ros-humble-behaviortree-cpp-v3 ros-humble-visualization-msgs ros-humble-action-msgs
      - name: Compile and check
        shell: bash
        run: bash scripts/build.sh
      - name: Headless integration (development goal, not official RViz trial)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 tests/ros_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: |
            test-output/
            log/
